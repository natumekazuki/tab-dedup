<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>重複タブを整理</title>
    <link rel="stylesheet" href="popup.css">
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">TAB DEDUP</p>
        <h1>重複タブを整理</h1>
        <p id="window-info" class="muted">このウィンドウを確認中…</p>
      </header>
      <section aria-label="URLの判定方式">
        <button type="button" class="dedup" data-mode="include-query" disabled>
          <span class="button-line"><span>クエリを含めて削除</span><span class="count" id="include-count">—</span></span>
        </button>
        <button type="button" class="dedup" data-mode="ignore-query" disabled>
          <span class="button-line"><span>クエリを無視して削除</span><span class="count" id="ignore-count">—</span></span>
        </button>
      </section>
      <section class="recovery" aria-labelledby="recovery-title">
        <div class="section-heading"><h2 id="recovery-title">削除を取り消す</h2><span id="history-count" class="muted">— / 5回分</span></div>
        <button type="button" id="restore" disabled>直前の削除を戻す</button>
        <p id="history-info" class="muted">復元履歴を確認中…</p>
      </section>
      <p id="status" role="status" aria-live="polite" hidden></p>
    </main>
  </body>
</html>
