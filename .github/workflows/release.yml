name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: masterに含まれるタグを確認
        run: git merge-base --is-ancestor HEAD origin/master
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run package -- "$RUNNER_TEMP/package"
      - run: npm run test:browser
        env:
          TAB_DEDUP_EXTENSION_PATH: ${{ runner.temp }}/package/extension
      - id: version
        run: echo "value=$(node -p 'JSON.parse(require("fs").readFileSync("extension/manifest.json")).version')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-zip
          path: ${{ runner.temp }}/package/tab-dedup-${{ steps.version.outputs.value }}.zip
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-failure
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-zip
          path: ${{ runner.temp }}/release
      - name: 検証済みZIPを公開
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          gh release create "v$RELEASE_VERSION" "$RUNNER_TEMP/release/tab-dedup-$RELEASE_VERSION.zip" \
            --verify-tag --title "v$RELEASE_VERSION" --notes-file "docs/releases/$RELEASE_VERSION.md"
